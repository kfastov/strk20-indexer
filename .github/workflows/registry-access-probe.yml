name: Official SDK registry access probe

on:
  push:
    branches: [codex/registry-access-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and reinstall the official package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-registry-access.py --expect allowed --report registry-access-results/packages-read.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-packages-read
          path: registry-access-results/
          if-no-files-found: error

  registry-integration:
    needs: packages-read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@starkware-libs'
      - name: Prepare registry dependencies in this disposable checkout
        run: |
          python3 scripts/prepare-registry-integration.py
          mkdir -p registry-access-results
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/starkware-libs/starknet-privacy/66e3caae8c0201227a6719696d004e30d90aea65/LICENSE -o registry-access-results/upstream-LICENSE
      - name: Resolve registry lockfiles and download the published archive
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm --prefix ts install @starkware-libs/starknet-privacy-sdk@0.14.3-rc.5 --workspace strk20-discovery --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/resolve-cache"
          npm --prefix examples/mainnet install --package-lock-only --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/resolve-cache"
          cp ts/package-lock.json registry-access-results/typescript-package-lock.json
          cp examples/mainnet/package-lock.json registry-access-results/examples-package-lock.json
          python3 scripts/prepare-registry-integration.py --verify-locks
          npm pack @starkware-libs/starknet-privacy-sdk@0.14.3-rc.5 --ignore-scripts --pack-destination registry-access-results --json > registry-access-results/upstream-pack.json
      - name: Install workspaces and examples with a fresh cache
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm --prefix ts ci --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/install-cache"
          npm --prefix examples/mainnet ci --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/example-cache"
          cd examples/mainnet
          node --input-type=module -e "await import('@starkware-libs/starknet-privacy-sdk'); console.log('Example SDK import passed')"
      - name: Install pinned Rust toolchain and WASM tooling
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          rustc --version
          wasm-pack --version
      - uses: Swatinem/rust-cache@v2
      - name: Build the actual WASM engine
        working-directory: crates/wasm
        run: wasm-pack build --release --target web --out-dir pkg --out-name strk20_engine
      - name: Build SDK and demo
        working-directory: ts
        run: npm run build
      - name: Typecheck all source files
        working-directory: ts
        run: npm run typecheck
      - name: Generate native reference fixtures
        run: cargo run --release --locked -p strk20-engine --example make_fixture
      - name: Run all SDK and demo tests against the published dependency
        working-directory: ts
        run: npm test
      - name: Verify packaged consumers without registry credentials
        working-directory: ts
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/anonymous-user.npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/anonymous-global.npmrc
          NPM_CONFIG_CACHE: ${{ runner.temp }}/anonymous-consumer-cache
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          touch "$NPM_CONFIG_USERCONFIG" "$NPM_CONFIG_GLOBALCONFIG"
          env -u NODE_AUTH_TOKEN npm run check:release --workspace strk20-discovery
      - name: Verify lockfiles stayed unchanged and no vendor directory exists
        run: |
          cmp ts/package-lock.json registry-access-results/typescript-package-lock.json
          cmp examples/mainnet/package-lock.json registry-access-results/examples-package-lock.json
          python3 scripts/prepare-registry-integration.py --verify-locks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-integration
          path: registry-access-results/
          if-no-files-found: error

  no-package-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Negative control without package permission
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-registry-access.py --expect denied --report registry-access-results/packages-none.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-packages-none
          path: registry-access-results/
          if-no-files-found: error
