[package]
name = "strk20-feed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "STRK20 feed format: canonical epoch codec, content addressing, hash-chain verification, MPT verification"

[features]
default = []
compress = ["dep:zstd"]
mpt = ["dep:starknet-crypto"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
starknet-types-core = { workspace = true }
zstd = { workspace = true, optional = true }
starknet-crypto = { workspace = true, optional = true }

# Self dev-dependency so this crate's OWN tests can exercise the feature-gated
# verification ladder (`verify_snapshot` needs compress + mpt). Without it the
# rings below ring 3 are reachable from no test in this crate.
[dev-dependencies]
strk20-feed = { path = ".", features = ["compress", "mpt"] }
