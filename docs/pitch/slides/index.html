<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRK20 Indexer</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #111827;
  }
  .slide { position: absolute; inset: 0; display: none; }
  .slide.active { display: block; }
  .slide svg { width: 100vw; height: 100vh; display: block; }
  svg text { font-family: inherit; }
</style>
</head>
<body>

<!-- 1. Private notes. A shared viewing key. -->
<section class="slide" id="slide-1">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-1">
  <title id="title-1">Private notes. A shared viewing key.</title>
  <defs>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="28" refY="15" orient="auto">
      <path d="M0 0 L30 15 L0 30 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="24" refY="13" orient="auto">
      <path d="M0 0 L26 13 L0 26 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="960" y="150" text-anchor="middle" font-size="64" font-weight="700" fill="#111827">Private notes. A shared viewing key.</text>

  <!-- Wallet -->
  <rect x="120" y="430" width="400" height="220" rx="28" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/>
  <text x="320" y="530" text-anchor="middle" font-size="44" font-weight="700" fill="#111827">Wallet</text>
  <text x="320" y="582" text-anchor="middle" font-size="28" fill="#111827">Holds your viewing key</text>

  <!-- Discovery service -->
  <rect x="720" y="430" width="420" height="220" rx="28" fill="#fff1f2" stroke="#dc2626" stroke-width="6"/>
  <text x="930" y="530" text-anchor="middle" font-size="44" font-weight="700" fill="#111827">Discovery service</text>
  <text x="930" y="582" text-anchor="middle" font-size="26" fill="#111827">Decrypts and finds your notes</text>

  <!-- Starknet -->
  <rect x="1400" y="430" width="400" height="220" rx="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="4"/>
  <text x="1600" y="530" text-anchor="middle" font-size="44" font-weight="700" fill="#111827">Starknet</text>
  <text x="1600" y="582" text-anchor="middle" font-size="28" fill="#111827">Public pool data</text>

  <!-- Wallet -> Discovery service: viewing key leaves the wallet -->
  <path d="M420 430 V320 Q420 300 440 300 H800 Q820 300 820 320 V428"
        fill="none" stroke="#dc2626" stroke-width="8" marker-end="url(#arrow-red)"/>
  <text x="620" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#dc2626">Viewing key → trust required</text>
  <g transform="translate(420 375)">
    <circle r="28" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
    <g transform="translate(-2 0)" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-8" cy="0" r="8"/>
      <path d="M0 0 H20 M13 0 V7 M19 0 V7"/>
    </g>
  </g>
  <g transform="translate(820 375)">
    <circle r="28" fill="#dc2626"/>
    <text y="14" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">?</text>
  </g>

  <!-- Discovery service -> Wallet -->
  <path d="M820 650 V720 Q820 740 800 740 H440 Q420 740 420 720 V652"
        fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <text x="620" y="708" text-anchor="middle" font-size="28" fill="#374151">Your notes + witnesses</text>

  <!-- Starknet -> Discovery service -->
  <path d="M1400 540 H1142" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <text x="1270" y="512" text-anchor="middle" font-size="26" fill="#374151">Pool data via RPC</text>

  <text x="930" y="860" text-anchor="middle" font-size="56" font-weight="700" fill="#dc2626">Who do you trust to see your notes?</text>
</svg>
</section>

<!-- 2. Public feed. Local discovery. -->
<section class="slide" id="slide-2">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-2">
  <title id="title-2">Public feed. Local discovery.</title>
  <defs>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="28" refY="15" orient="auto">
      <path d="M0 0 L30 15 L0 30 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray-2" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="24" refY="13" orient="auto">
      <path d="M0 0 L26 13 L0 26 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="960" y="140" text-anchor="middle" font-size="64" font-weight="700" fill="#111827">Public feed. Local discovery.</text>

  <!-- Your wallet / browser -->
  <rect x="100" y="310" width="400" height="450" rx="32" fill="#ecfdf5" stroke="#059669" stroke-width="6"/>
  <text x="300" y="365" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">Your wallet / browser</text>

  <rect x="140" y="400" width="320" height="90" rx="18" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
  <g transform="translate(182 445)">
    <g transform="translate(-2 0)" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-8" cy="0" r="8"/>
      <path d="M0 0 H20 M13 0 V7 M19 0 V7"/>
    </g>
  </g>
  <text x="222" y="437" font-size="28" font-weight="700" fill="#111827">Viewing key</text>
  <text x="222" y="470" font-size="24" fill="#111827">Stays here</text>

  <path d="M300 490 V528" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow-gray-2)"/>

  <rect x="140" y="530" width="320" height="190" rx="18" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <text x="300" y="615" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">Verify locally</text>
  <text x="300" y="672" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">Find my notes</text>

  <!-- STRK20 Indexer -->
  <rect x="900" y="500" width="380" height="220" rx="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="4"/>
  <text x="1090" y="585" text-anchor="middle" font-size="44" font-weight="700" fill="#111827">STRK20 Indexer</text>
  <text x="1090" y="632" text-anchor="middle" font-size="26" fill="#111827">Public snapshot</text>
  <text x="1090" y="666" text-anchor="middle" font-size="26" fill="#111827">+ incremental diffs</text>

  <!-- Starknet -->
  <rect x="1480" y="500" width="320" height="220" rx="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="4"/>
  <text x="1640" y="600" text-anchor="middle" font-size="44" font-weight="700" fill="#111827">Starknet</text>
  <text x="1640" y="652" text-anchor="middle" font-size="28" fill="#111827">Public pool data</text>

  <!-- Starknet -> STRK20 Indexer -->
  <path d="M1480 610 H1282" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow-gray-2)"/>
  <text x="1380" y="566" text-anchor="middle" font-size="26" fill="#374151">Public storage</text>
  <text x="1380" y="598" text-anchor="middle" font-size="26" fill="#374151">+ events</text>

  <!-- STRK20 Indexer -> wallet: public feed, no viewing key -->
  <path d="M900 610 H502" fill="none" stroke="#059669" stroke-width="8" marker-end="url(#arrow-green)"/>
  <text x="700" y="580" text-anchor="middle" font-size="28" font-weight="700" fill="#047857">Public feed · no viewing key</text>

  <!-- Independent RPC -->
  <rect x="940" y="830" width="300" height="80" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <text x="1090" y="880" text-anchor="middle" font-size="28" font-weight="600" fill="#111827">Independent RPC</text>
  <path d="M940 870 H320 Q300 870 300 850 V762" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow-gray-2)"/>
  <text x="620" y="846" text-anchor="middle" font-size="26" fill="#374151">Block header + storage proof</text>

  <text x="960" y="1000" text-anchor="middle" font-size="50" font-weight="700" fill="#047857">The discovery server never receives your viewing key.</text>
</svg>
</section>

<script>
  const slides = Array.from(document.querySelectorAll('.slide'));
  let current = 0;
  function show(n) {
    current = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('active', k === current));
    history.replaceState(null, '', '#' + (current + 1));
  }
  function fromHash() {
    const n = parseInt(location.hash.slice(1), 10);
    show(Number.isFinite(n) ? n - 1 : 0);
  }
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(current + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(current - 1); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
  });
  addEventListener('hashchange', fromHash);
  fromHash();
</script>
</body>
</html>
