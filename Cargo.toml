[workspace]
resolver = "2"
members = [
    "crates/feed",
    "crates/indexerd",
    "crates/consumer",
    "crates/client",
    "crates/e2e-tests",
    "crates/wasm",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kfastov/strk20-indexer"

[workspace.dependencies]
# Engine — tag is mutable upstream; Cargo.lock pins rev 74841caf0466d122117945e28ed983e2864c8fc1.
# `default-features = false` drops the unused `starknet-providers` (and its
# reqwest/web-sys stack) via the `[patch]` fork below. It must be set HERE:
# a member inheriting with `workspace = true` may add features but never remove
# them, so the same line in crates/consumer was silently ignored. Nothing in
# this workspace references starknet-providers, so no member opts back in.
discovery-core = { git = "https://github.com/starkware-libs/starknet-privacy.git", tag = "CONTRACT_V2_DEPLOYED_MAINNET_2026-07-08", default-features = false }
# Type identity with the engine (fork EmittedEvent, BlockId, StorageResult) — rev 7caedfef85a4d748f8e9e5a159c87c31b6fe9d71
starknet-core = { package = "starknet-rust-core", git = "https://github.com/software-mansion/starknet-rust.git", rev = "7caedfe" }
starknet-crypto = { package = "starknet-rust-crypto", git = "https://github.com/software-mansion/starknet-rust.git", rev = "7caedfe" }
# crates.io 1.0.0 is a DIFFERENT Felt type — must stay 0.2.x (see docs/spec/architecture.md §3)
starknet-types-core = { version = "=0.2.4", features = ["curve", "serde"] }

strk20-feed = { path = "crates/feed" }
strk20-client = { path = "crates/client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
zstd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
zeroize = "1"

# Upstream fork gate — see docs/ops/fork.md and patches/discovery-core-providers-gate.patch.
#
# The fork branch `strk20/providers-gate-74841ca` is the pinned upstream rev
# 74841caf0466d122117945e28ed983e2864c8fc1 plus exactly one commit that makes
# `starknet-providers` an optional dependency of `discovery-core` behind a
# default-on `providers` feature. Zero lines under `discovery-core/src` differ
# from upstream; CI job `fork-delta-check` enforces that mechanically.
#
# Purpose: with `default-features = false` a wasm consumer drops 24 crates from
# the wasm32-unknown-unknown graph (142 -> 118), including `starknet-providers`,
# `reqwest`, `web-sys`, `wasm-bindgen-futures` and the `ethereum-types` stack.
# NOTE, measured 2026-08-31: `discovery-core` already builds for
# wasm32-unknown-unknown with default features. This is a dependency-surface
# reduction, not a fix for a broken target — do not claim otherwise.
# The feature is default-on, so this patch is a no-op for the native build.
#
# ONE workspace-wide patch, never a split pin: two `[patch]` entries resolving
# to two `discovery-core` sources would put two incompatible `Felt` identities
# in one workspace (see docs/spec/architecture.md §3).
#
# Remove this section and `patches/` in a single commit once the upstream PR
# merges.
[patch."https://github.com/starkware-libs/starknet-privacy.git"]
discovery-core = { git = "https://github.com/kfastov/starknet-privacy.git", rev = "e7f0177aab66a9c79699c358b728f9b0324f437e" }

[profile.release]
lto = "thin"
